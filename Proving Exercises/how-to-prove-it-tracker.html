<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How to Prove It — Exercise Tracker</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --panel-3: #23283311;
    --border: #2a2f3a;
    --text: #e8eaed;
    --muted: #8b93a3;
    --accent: #6ee7b7;
    --accent-2: #38bdf8;
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 80px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 20px; }

  .overall {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    position: sticky;
    top: 12px;
    z-index: 10;
  }
  .overall-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .overall-top span:first-child { font-weight: 600; }
  .overall-top span:last-child { color: var(--muted); font-size: 13px; }
  .bar-track {
    background: var(--panel-2);
    border-radius: 999px;
    height: 10px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-2), var(--accent));
    border-radius: 999px;
    transition: width 0.25s ease;
  }

  .controls-row {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  input[type="text"] {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent-2); }

  button {
    background: var(--accent-2);
    color: #0f1115;
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button.ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    font-weight: 500;
    padding: 8px 12px;
    font-size: 13px;
  }
  button.ghost:hover { color: var(--text); border-color: var(--muted); }
  button.icon-btn {
    background: transparent;
    color: var(--muted);
    padding: 4px 8px;
    font-size: 15px;
  }
  button.icon-btn:hover { color: var(--danger); }
  button.small {
    padding: 6px 10px;
    font-size: 13px;
  }

  /* Chapter */
  .chapter {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .chapter-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    cursor: pointer;
  }
  .chapter-header-left { flex: 1; min-width: 0; }
  .chapter-title {
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 6px;
  }
  .progress-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .progress-row .bar-track { flex: 1; height: 6px; }
  .progress-row .count { color: var(--muted); font-size: 12px; white-space: nowrap; }

  .caret {
    color: var(--muted);
    margin-left: 10px;
    transition: transform 0.2s ease;
    flex-shrink: 0;
  }
  .collapsed > .caret,
  .chapter.collapsed .chapter-header .caret,
  .section.collapsed .section-header .caret { transform: rotate(-90deg); }

  .chapter-body {
    border-top: 1px solid var(--border);
    padding: 10px 12px 14px;
  }
  .chapter.collapsed .chapter-body { display: none; }

  /* Section (nested inside chapter) */
  .section {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin: 8px 0;
    overflow: hidden;
  }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    cursor: pointer;
  }
  .section-header-left { flex: 1; min-width: 0; }
  .section-title {
    font-weight: 600;
    font-size: 13.5px;
    margin-bottom: 5px;
  }
  .section-body {
    border-top: 1px solid var(--border);
    padding: 6px 12px 10px;
  }
  .section.collapsed .section-body { display: none; }

  .exercise-list { list-style: none; margin: 0 0 10px; padding: 0; }
  .exercise-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
  }
  .exercise-item:last-child { border-bottom: none; }
  .exercise-item input[type="checkbox"] {
    width: 17px;
    height: 17px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  .exercise-item label {
    flex: 1;
    cursor: pointer;
    font-size: 13.5px;
  }
  .exercise-item.done label {
    color: var(--muted);
    text-decoration: line-through;
  }

  .add-row {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .add-row input { flex: 1; }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
    font-size: 14px;
  }

  .reset-row {
    text-align: center;
    margin-top: 24px;
  }

  .badge {
    display: inline-block;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 999px;
    margin-left: 8px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>📘 How to Prove It — Exercise Tracker</h1>
  <div class="subtitle">Track your progress through every chapter, section, and exercise. Saves automatically in this browser.</div>

  <div class="overall">
    <div class="overall-top">
      <span>Overall progress</span>
      <span id="overallCount">0 / 0</span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="overallBar" style="width:0%"></div></div>
  </div>

  <div class="controls-row">
    <button class="ghost small" onclick="expandAll()">Expand all</button>
    <button class="ghost small" onclick="collapseAll()">Collapse all</button>
    <button class="ghost small" onclick="addChapter()">+ Add chapter</button>
  </div>

  <div id="chapterList"></div>
  <div class="empty" id="emptyState">No chapters yet.</div>

  <div class="reset-row">
    <button class="ghost" onclick="resetAll()">Reset all progress</button>
  </div>
</div>

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return JSON.parse(JSON.stringify(INITIAL_DATA));
    return JSON.parse(raw);
  } catch (e) {
    console.error("Failed to load data", e);
    return JSON.parse(JSON.stringify(INITIAL_DATA));
  }
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    console.error("Failed to save data", e);
  }
}

let data = loadData();

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function addChapter() {
  const name = prompt("Chapter name (e.g. Chapter 8: New Chapter)");
  if (!name || !name.trim()) return;
  data.chapters.push({ id: uid(), name: name.trim(), collapsed: false, sections: [] });
  saveData();
  render();
}

function deleteChapter(chapterId) {
  if (!confirm("Delete this chapter and everything in it?")) return;
  data.chapters = data.chapters.filter(c => c.id !== chapterId);
  saveData();
  render();
}

function toggleChapterCollapsed(chapterId) {
  const ch = data.chapters.find(c => c.id === chapterId);
  if (ch) ch.collapsed = !ch.collapsed;
  saveData();
  render();
}

function addSection(chapterId) {
  const name = prompt("Section name (e.g. Section 8.1: New Section)");
  if (!name || !name.trim()) return;
  const ch = data.chapters.find(c => c.id === chapterId);
  if (!ch) return;
  ch.sections.push({ id: uid(), name: name.trim(), collapsed: false, exercises: [] });
  saveData();
  render();
}

function deleteSection(chapterId, sectionId) {
  if (!confirm("Delete this section and its exercises?")) return;
  const ch = data.chapters.find(c => c.id === chapterId);
  if (!ch) return;
  ch.sections = ch.sections.filter(s => s.id !== sectionId);
  saveData();
  render();
}

function toggleSectionCollapsed(chapterId, sectionId) {
  const ch = data.chapters.find(c => c.id === chapterId);
  if (!ch) return;
  const sec = ch.sections.find(s => s.id === sectionId);
  if (sec) sec.collapsed = !sec.collapsed;
  saveData();
  render();
}

function addExercise(chapterId, sectionId, inputEl) {
  const name = inputEl.value.trim();
  if (!name) return;
  const ch = data.chapters.find(c => c.id === chapterId);
  if (!ch) return;
  const sec = ch.sections.find(s => s.id === sectionId);
  if (!sec) return;
  sec.exercises.push({ id: uid(), name, done: false });
  inputEl.value = "";
  saveData();
  render();
}

function toggleExercise(chapterId, sectionId, exerciseId) {
  const ch = data.chapters.find(c => c.id === chapterId);
  if (!ch) return;
  const sec = ch.sections.find(s => s.id === sectionId);
  if (!sec) return;
  const ex = sec.exercises.find(e => e.id === exerciseId);
  if (ex) ex.done = !ex.done;
  saveData();
  render();
}

function deleteExercise(chapterId, sectionId, exerciseId) {
  const ch = data.chapters.find(c => c.id === chapterId);
  if (!ch) return;
  const sec = ch.sections.find(s => s.id === sectionId);
  if (!sec) return;
  sec.exercises = sec.exercises.filter(e => e.id !== exerciseId);
  saveData();
  render();
}

function resetAll() {
  if (!confirm("This will erase all your checked progress and any custom chapters/sections/exercises you've added, restoring the original book structure. Are you sure?")) return;
  data = JSON.parse(JSON.stringify(INITIAL_DATA));
  saveData();
  render();
}

function expandAll() {
  data.chapters.forEach(ch => {
    ch.collapsed = false;
    ch.sections.forEach(sec => sec.collapsed = false);
  });
  saveData();
  render();
}

function collapseAll() {
  data.chapters.forEach(ch => {
    ch.collapsed = true;
  });
  saveData();
  render();
}

function sectionStats(sec) {
  const total = sec.exercises.length;
  const done = sec.exercises.filter(e => e.done).length;
  return { total, done, pct: total ? Math.round((done / total) * 100) : 0 };
}

function chapterStats(ch) {
  let total = 0, done = 0;
  ch.sections.forEach(sec => {
    total += sec.exercises.length;
    done += sec.exercises.filter(e => e.done).length;
  });
  return { total, done, pct: total ? Math.round((done / total) * 100) : 0 };
}

function render() {
  const list = document.getElementById("chapterList");
  const empty = document.getElementById("emptyState");
  list.innerHTML = "";

  empty.style.display = data.chapters.length === 0 ? "block" : "none";

  let totalAll = 0, doneAll = 0;

  data.chapters.forEach(ch => {
    const { total, done, pct } = chapterStats(ch);
    totalAll += total;
    doneAll += done;

    const chapterEl = document.createElement("div");
    chapterEl.className = "chapter" + (ch.collapsed ? " collapsed" : "");

    const sectionsHtml = ch.sections.map(sec => {
      const s = sectionStats(sec);
      return `
        <div class="section ${sec.collapsed ? 'collapsed' : ''}">
          <div class="section-header" data-toggle-section="${ch.id}|${sec.id}">
            <div class="section-header-left">
              <div class="section-title">${escapeHtml(sec.name)}</div>
              <div class="progress-row">
                <div class="bar-track"><div class="bar-fill" style="width:${s.pct}%"></div></div>
                <span class="count">${s.done}/${s.total}</span>
              </div>
            </div>
            <button class="icon-btn" data-delete-section="${ch.id}|${sec.id}" title="Delete section">✕</button>
            <span class="caret">▾</span>
          </div>
          <div class="section-body">
            <ul class="exercise-list">
              ${sec.exercises.map(ex => `
                <li class="exercise-item ${ex.done ? 'done' : ''}">
                  <input type="checkbox" id="ex-${ex.id}" ${ex.done ? 'checked' : ''} data-toggle-exercise="${ch.id}|${sec.id}|${ex.id}">
                  <label for="ex-${ex.id}">${escapeHtml(ex.name)}</label>
                  <button class="icon-btn" data-delete-exercise="${ch.id}|${sec.id}|${ex.id}" title="Delete exercise">✕</button>
                </li>
              `).join("")}
            </ul>
            <div class="add-row">
              <input type="text" placeholder="e.g. Exercise ${sec.exercises.length + 1}" data-exercise-input="${ch.id}|${sec.id}">
              <button class="small" data-add-exercise="${ch.id}|${sec.id}">Add</button>
            </div>
          </div>
        </div>
      `;
    }).join("");

    chapterEl.innerHTML = `
      <div class="chapter-header" data-toggle-chapter="${ch.id}">
        <div class="chapter-header-left">
          <div class="chapter-title">${escapeHtml(ch.name)}</div>
          <div class="progress-row">
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
            <span class="count">${done}/${total}</span>
          </div>
        </div>
        <button class="icon-btn" data-delete-chapter="${ch.id}" title="Delete chapter">✕</button>
        <span class="caret">▾</span>
      </div>
      <div class="chapter-body">
        ${sectionsHtml}
        <div class="add-row">
          <button class="small ghost" data-add-section="${ch.id}">+ Add section</button>
        </div>
      </div>
    `;
    list.appendChild(chapterEl);
  });

  document.getElementById("overallCount").textContent = `${doneAll} / ${totalAll}`;
  document.getElementById("overallBar").style.width = totalAll ? `${Math.round((doneAll / totalAll) * 100)}%` : "0%";

  attachEvents();
}

function attachEvents() {
  document.querySelectorAll("[data-toggle-chapter]").forEach(el => {
    el.addEventListener("click", (e) => {
      if (e.target.closest("[data-delete-chapter]")) return;
      toggleChapterCollapsed(el.getAttribute("data-toggle-chapter"));
    });
  });
  document.querySelectorAll("[data-delete-chapter]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      deleteChapter(el.getAttribute("data-delete-chapter"));
    });
  });
  document.querySelectorAll("[data-toggle-section]").forEach(el => {
    el.addEventListener("click", (e) => {
      if (e.target.closest("[data-delete-section]")) return;
      const [chapterId, sectionId] = el.getAttribute("data-toggle-section").split("|");
      toggleSectionCollapsed(chapterId, sectionId);
    });
  });
  document.querySelectorAll("[data-delete-section]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const [chapterId, sectionId] = el.getAttribute("data-delete-section").split("|");
      deleteSection(chapterId, sectionId);
    });
  });
  document.querySelectorAll("[data-toggle-exercise]").forEach(el => {
    el.addEventListener("change", () => {
      const [chapterId, sectionId, exerciseId] = el.getAttribute("data-toggle-exercise").split("|");
      toggleExercise(chapterId, sectionId, exerciseId);
    });
  });
  document.querySelectorAll("[data-delete-exercise]").forEach(el => {
    el.addEventListener("click", () => {
      const [chapterId, sectionId, exerciseId] = el.getAttribute("data-delete-exercise").split("|");
      deleteExercise(chapterId, sectionId, exerciseId);
    });
  });
  document.querySelectorAll("[data-add-exercise]").forEach(el => {
    el.addEventListener("click", () => {
      const [chapterId, sectionId] = el.getAttribute("data-add-exercise").split("|");
      const input = document.querySelector(`[data-exercise-input="${chapterId}|${sectionId}"]`);
      addExercise(chapterId, sectionId, input);
    });
  });
  document.querySelectorAll("[data-exercise-input]").forEach(el => {
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const [chapterId, sectionId] = el.getAttribute("data-exercise-input").split("|");
        addExercise(chapterId, sectionId, el);
      }
    });
  });
  document.querySelectorAll("[data-add-section]").forEach(el => {
    el.addEventListener("click", () => {
      addSection(el.getAttribute("data-add-section"));
    });
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

render();
</script>
</body>
</html>
